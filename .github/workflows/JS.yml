name: JavaScript CI

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/JS.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/kola/**"
      - "bindings/napi-kola/**"
      - "js-kola/**"
  pull_request:
    paths:
      - ".github/workflows/JS.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/kola/**"
      - "bindings/napi-kola/**"
      - "js-kola/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64-msvc:
    name: Windows x64 MSVC
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: js-kola
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js-kola/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build release native addon
        run: npm run build:native:release -- --target x86_64-pc-windows-msvc
      - name: Build TypeScript
        run: npm run build:ts
      - name: Run Vitest
        run: npm test
      - name: Stage and pack packages
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item kola_q.win32-x64-msvc.node npm/win32-x64-msvc/kola_q.win32-x64-msvc.node
          npm pack --pack-destination artifacts
          npm pack ./npm/win32-x64-msvc --pack-destination artifacts
      - name: Smoke-test packed installation
        run: |
          $version = node -p "require('./package.json').version"
          $platformVersion = node -p "require('./npm/win32-x64-msvc/package.json').version"
          $rootTarball = (Resolve-Path "artifacts/kola-q-$version.tgz").Path
          $platformTarball = (Resolve-Path "artifacts/kola-q-win32-x64-msvc-$platformVersion.tgz").Path
          $smokeDir = Join-Path $env:RUNNER_TEMP "kola-q-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory $smokeDir | Out-Null
          Set-Location $smokeDir
          npm init -y
          npm install --omit=optional --no-audit --no-fund $rootTarball $platformTarball
          node --input-type=module -e 'const { serializeAsIpcBytes6 } = await import("kola-q"); const bytes = await serializeAsIpcBytes6("sync", false, 42); if (!Buffer.isBuffer(bytes) || bytes.length === 0) throw new Error("native serialization returned no bytes");'
      - name: Upload packed packages and native addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kola-q-win32-x64-msvc
          if-no-files-found: error
          retention-days: 7
          path: |
            js-kola/artifacts/*.tgz
            js-kola/kola_q.win32-x64-msvc.node

  linux-x64-gnu:
    name: Linux x64 GNU (glibc 2.28)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64:latest
    defaults:
      run:
        shell: bash
        working-directory: js-kola
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js-kola/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run Rust unit tests
        working-directory: .
        run: cargo test --locked -p kola -p napi-kola

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build release native addon
        run: npm run build:native:release -- --target x86_64-unknown-linux-gnu
      - name: Build TypeScript
        run: npm run build:ts
      - name: Run Vitest
        run: npm test
      - name: Stage and pack packages
        run: |
          mkdir -p artifacts
          cp kola_q.linux-x64-gnu.node npm/linux-x64-gnu/kola_q.linux-x64-gnu.node
          npm pack --pack-destination artifacts
          npm pack ./npm/linux-x64-gnu --pack-destination artifacts
      - name: Smoke-test packed installation on glibc 2.28
        run: |
          version="$(node -p "require('./package.json').version")"
          platform_version="$(node -p "require('./npm/linux-x64-gnu/package.json').version")"
          root_tarball="$PWD/artifacts/kola-q-$version.tgz"
          platform_tarball="$PWD/artifacts/kola-q-linux-x64-gnu-$platform_version.tgz"
          smoke_dir="$RUNNER_TEMP/kola-q-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$smoke_dir"
          cd "$smoke_dir"
          npm init -y
          npm install --omit=optional --no-audit --no-fund "$root_tarball" "$platform_tarball"
          node --input-type=module -e 'const { serializeAsIpcBytes6 } = await import("kola-q"); const bytes = await serializeAsIpcBytes6("sync", false, 42); if (!Buffer.isBuffer(bytes) || bytes.length === 0) throw new Error("native serialization returned no bytes");'
      - name: Upload packed packages and native addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kola-q-linux-x64-gnu
          if-no-files-found: error
          retention-days: 7
          path: |
            js-kola/artifacts/*.tgz
            js-kola/kola_q.linux-x64-gnu.node

  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: js-kola
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js-kola/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Build release native addon
        run: npm run build:native:release -- --target aarch64-apple-darwin
      - name: Build TypeScript
        run: npm run build:ts
      - name: Run Vitest
        run: npm test
      - name: Stage and pack packages
        run: |
          mkdir -p artifacts
          cp kola_q.darwin-arm64.node npm/darwin-arm64/kola_q.darwin-arm64.node
          npm pack --pack-destination artifacts
          npm pack ./npm/darwin-arm64 --pack-destination artifacts
      - name: Smoke-test packed installation
        run: |
          version="$(node -p "require('./package.json').version")"
          platform_version="$(node -p "require('./npm/darwin-arm64/package.json').version")"
          root_tarball="$PWD/artifacts/kola-q-$version.tgz"
          platform_tarball="$PWD/artifacts/kola-q-darwin-arm64-$platform_version.tgz"
          smoke_dir="$RUNNER_TEMP/kola-q-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$smoke_dir"
          cd "$smoke_dir"
          npm init -y
          npm install --omit=optional --no-audit --no-fund "$root_tarball" "$platform_tarball"
          node --input-type=module -e 'const { serializeAsIpcBytes6 } = await import("kola-q"); const bytes = await serializeAsIpcBytes6("sync", false, 42); if (!Buffer.isBuffer(bytes) || bytes.length === 0) throw new Error("native serialization returned no bytes");'
      - name: Upload packed packages and native addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kola-q-darwin-arm64
          if-no-files-found: error
          retention-days: 7
          path: |
            js-kola/artifacts/*.tgz
            js-kola/kola_q.darwin-arm64.node
